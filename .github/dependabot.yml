# Dependabot version updates — weekly PRs, minor/patch bumps grouped per
# ecosystem; major bumps stay individual so breaking changes get their own
# review. (Alerts + security updates are enabled in the repo Security
# settings; this file only controls the proactive PR cadence.)
version: 2
updates:
  # requirements.txt (runtime) + requirements-dev.txt (test), both in the
  # repo root — one pip entry covers every manifest in the directory.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base image of the extractor image (python:3.14-slim-bookworm).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]

  # Action pins in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]