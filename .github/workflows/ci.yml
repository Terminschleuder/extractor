name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*", "alpha-*", "*alpha"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (host venv) & build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write       # to write the buildx GHA cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Tests run on the host venv (no GIS/network: httpx is mocked with respx,
      # the OpenAI client is faked) — mirroring the local verification gate.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      # Ensure the production image still builds (no push here). Buildx is
      # required for the GHA cache backend (the default docker driver can't
      # export cache).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish the image to ghcr.io only when a commit lands on main (an accepted
  # PR, once main is branch-protected) or when a release tag is pushed. Develop
  # pushes and PRs build/test above but never publish.
  publish:
    name: Build & publish image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write      # for buildx provenance/SLSA attestation
      attestations: write  # to push provenance attestations
      actions: write       # to write the buildx GHA cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/terminschleuder/extractor
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=terminschleuder-extractor
            org.opencontainers.image.description=LLM-based extractor for the terminschleuder ingestion API (OpenAI-compatible inference)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the published image; fail only on fixable CRITICAL vulns.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1