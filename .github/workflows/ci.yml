name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute version + build image, no push/tag/release"
        type: boolean
        default: false

permissions:
  contents: read

# PRs and develop pushes may cancel their in-flight predecessors, but a push to
# main never cancels a running release — it queues behind it (see the job-level
# release-queue group below).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  test:
    name: Test (host venv) & build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write       # to write the buildx GHA cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Tests run on the host venv (no GIS/network: httpx is mocked with respx,
      # the OpenAI client is faked) — mirroring the local verification gate.
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      # Ensure the production image still builds (no push here). Buildx is
      # required for the GHA cache backend (the default docker driver can't
      # export cache).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every accepted change on main (a PR merge or a push) cuts the next CalVer
  # release (YYYY.MINOR.0, e.g. v2026.1.0): it versions, builds & pushes the
  # image to ghcr.io, scans it, then creates the git tag + GitHub Release last
  # (so a failed re-run recomputes the same version and stays idempotent).
  # PRs and develop pushes build/test above but never release.
  release:
    name: Version, publish image & cut release
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # create tag + GitHub Release
      packages: write      # push to ghcr.io
      id-token: write      # for buildx provenance/SLSA attestation
      attestations: write  # to push provenance attestations
      actions: write       # to write the buildx GHA cache
    concurrency:
      group: release-queue
      cancel-in-progress: false   # serialize releases; never kill a publish

    steps:
      # Full history: the version computation must see all remote tags
      # (CalVer tags are created here, not locally).
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute next version (CalVer YYYY.MINOR.0)
        id: version
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          LATEST=$(git tag -l "v${YEAR}.*" | sort -V | tail -n1)
          MINOR=0
          [ -n "$LATEST" ] && MINOR=$(echo "$LATEST" | cut -d. -f2)
          NEXT="${YEAR}.$((MINOR + 1)).0"
          # Idempotent re-run: if the tag already exists on THIS commit (a
          # failed release retried), reuse it rather than skipping a version.
          if git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; then
            if [ "$(git rev-parse "v${NEXT}^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::tag v${NEXT} already exists on a different commit" >&2
              exit 1
            fi
            echo "Reusing existing tag v${NEXT} for this commit (failed-run retry)."
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"     >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/terminschleuder/extractor
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=terminschleuder-extractor
            org.opencontainers.image.description=LLM-based extractor for the terminschleuder ingestion API (OpenAI-compatible inference)
            org.opencontainers.image.licenses=Apache-2.0

      # Dry runs (workflow_dispatch with dry_run=true) build but don't push.
      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the published image by its registry ref (buildx pushes straight
      # to ghcr without loading into the daemon, so the local imageid isn't
      # scannable; trivy reads the ghcr creds login-action wrote to the docker
      # config). cache: true caches the vuln DB across runs. Skipped on dry
      # runs (the registry ref only exists after a push).
      - name: Trivy scan
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          cache: true

      # LAST, deliberately: a failed earlier step re-runs with the same
      # version and re-pushed tags, then cuts the release — never the reverse
      # (a published release with no image). gh is preinstalled on the runner;
      # creating a release for a nonexistent tag also creates the tag at
      # --target, and the API-attached source tarballs publish the source.
      - name: Create tag & GitHub Release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Automated CalVer release $VERSION. Image: ghcr.io/terminschleuder/extractor ($VERSION, latest)." \
            --generate-notes